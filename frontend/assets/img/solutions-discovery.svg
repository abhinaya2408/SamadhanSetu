<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" role="img" aria-label="A search across a repository of prior solutions, with reuse, adapt and build-new options" width="460" height="300">
  <rect width="460" height="300" rx="22" fill="#fdf6f0"/>
  <!-- search bar -->
  <g transform="translate(40,28)">
    <rect x="0" y="0" width="380" height="52" rx="26" fill="#ffffff" stroke="#e6e3df"/>
    <circle cx="30" cy="26" r="10" fill="none" stroke="#8b8f94" stroke-width="4"/>
    <path d="M38 34 l10 10" stroke="#8b8f94" stroke-width="4" stroke-linecap="round"/>
    <rect x="60" y="20" width="180" height="10" rx="5" fill="#e6e3df"/>
  </g>
  <!-- result cards -->
  <g transform="translate(40,100)">
    <!-- card 1 -->
    <rect x="0" y="0" width="176" height="86" rx="12" fill="#ffffff" stroke="#e6e3df"/>
    <rect x="14" y="14" width="70" height="9" rx="4.5" fill="#e4573d"/>
    <g stroke="#e6e3df" stroke-width="5" stroke-linecap="round">
      <path d="M14 38 h140"/><path d="M14 52 h120"/><path d="M14 66 h84"/>
    </g>
    <rect x="128" y="58" width="34" height="16" rx="8" fill="#e8f5ee"/>
    <text x="145" y="70" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1f7a4d">REUSE</text>
    <!-- card 2 -->
    <rect x="196" y="0" width="184" height="86" rx="12" fill="#ffffff" stroke="#e6e3df"/>
    <rect x="210" y="14" width="90" height="9" rx="4.5" fill="#2b6cb0"/>
    <g stroke="#e6e3df" stroke-width="5" stroke-linecap="round">
      <path d="M210 38 h148"/><path d="M210 52 h128"/><path d="M210 66 h90"/>
    </g>
    <rect x="330" y="58" width="34" height="16" rx="8" fill="#e9f1fa"/>
    <text x="347" y="70" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#2b6cb0">ADAPT</text>
  </g>
  <!-- big build-new banner -->
  <g transform="translate(40,206)">
    <rect x="0" y="0" width="380" height="66" rx="14" fill="#1d1d1f"/>
    <circle cx="40" cy="33" r="18" fill="#e4573d"/>
    <path d="M34 33 l5 6 11 -14" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="72" y="28" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Nothing suitable found?</text>
    <text x="72" y="48" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#cccccc">A mentor scopes a build-new student project.</text>
  </g>
</svg>

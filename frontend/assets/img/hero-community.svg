<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 620" role="img"
     aria-labelledby="heroTitle heroDesc" width="820" height="620">
  <title id="heroTitle">A neighbourhood problem-solving scene</title>
  <desc id="heroDesc">A citizen photographs a broken street light on a residential street, a map
    shows related reports nearby, students build a solar street-light prototype at a table, and a
    faculty mentor reviews the design on a clipboard.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6ef"/>
      <stop offset="1" stop-color="#fbe9df"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9e4de"/>
      <stop offset="1" stop-color="#dcd5cd"/>
    </linearGradient>
    <linearGradient id="lampGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd36b" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffd36b" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame">
      <rect x="0" y="0" width="820" height="620" rx="26"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="0" y="0" width="820" height="620" fill="url(#sky)"/>

    <!-- soft sun -->
    <circle cx="660" cy="120" r="70" fill="#ffd9a8" opacity="0.55"/>
    <circle cx="660" cy="120" r="44" fill="#ffc97e" opacity="0.7"/>

    <!-- background buildings -->
    <g opacity="0.95">
      <rect x="20" y="150" width="150" height="300" rx="8" fill="#f2d9cf"/>
      <rect x="180" y="200" width="120" height="250" rx="8" fill="#e7cfc6"/>
      <rect x="620" y="170" width="180" height="280" rx="8" fill="#f2d9cf"/>
      <rect x="500" y="215" width="110" height="235" rx="8" fill="#edd8d0"/>
      <!-- windows -->
      <g fill="#ffffff" opacity="0.85">
        <rect x="40" y="176" width="30" height="26" rx="4"/>
        <rect x="88" y="176" width="30" height="26" rx="4"/>
        <rect x="40" y="222" width="30" height="26" rx="4"/>
        <rect x="88" y="222" width="30" height="26" rx="4"/>
        <rect x="40" y="268" width="30" height="26" rx="4"/>
        <rect x="88" y="268" width="30" height="26" rx="4"/>
        <rect x="198" y="228" width="26" height="24" rx="4"/>
        <rect x="242" y="228" width="26" height="24" rx="4"/>
        <rect x="198" y="272" width="26" height="24" rx="4"/>
        <rect x="242" y="272" width="26" height="24" rx="4"/>
        <rect x="640" y="196" width="32" height="26" rx="4"/>
        <rect x="690" y="196" width="32" height="26" rx="4"/>
        <rect x="740" y="196" width="32" height="26" rx="4"/>
        <rect x="640" y="244" width="32" height="26" rx="4"/>
        <rect x="690" y="244" width="32" height="26" rx="4"/>
        <rect x="740" y="244" width="32" height="26" rx="4"/>
        <rect x="516" y="240" width="26" height="24" rx="4"/>
        <rect x="558" y="240" width="26" height="24" rx="4"/>
      </g>
      <!-- water tank on roof -->
      <rect x="712" y="150" width="56" height="24" rx="6" fill="#cfc3bb"/>
      <rect x="728" y="138" width="24" height="16" rx="5" fill="#b9aca3"/>
    </g>

    <!-- trees -->
    <g>
      <rect x="150" y="392" width="12" height="58" rx="4" fill="#9c6b45"/>
      <circle cx="156" cy="368" r="40" fill="#7fb069"/>
      <circle cx="126" cy="386" r="26" fill="#6da35c"/>
      <circle cx="186" cy="386" r="26" fill="#6da35c"/>
      <rect x="466" y="404" width="11" height="46" rx="4" fill="#9c6b45"/>
      <circle cx="471" cy="384" r="32" fill="#7fb069"/>
      <circle cx="448" cy="400" r="20" fill="#6da35c"/>
      <circle cx="494" cy="400" r="20" fill="#6da35c"/>
    </g>

    <!-- street -->
    <rect x="0" y="450" width="820" height="170" fill="url(#road)"/>
    <rect x="0" y="450" width="820" height="8" fill="#cfc7bd"/>
    <!-- lane markings -->
    <g fill="#ffffff" opacity="0.75">
      <rect x="40" y="536" width="60" height="8" rx="4"/>
      <rect x="150" y="536" width="60" height="8" rx="4"/>
      <rect x="260" y="536" width="60" height="8" rx="4"/>
      <rect x="370" y="536" width="60" height="8" rx="4"/>
      <rect x="480" y="536" width="60" height="8" rx="4"/>
      <rect x="590" y="536" width="60" height="8" rx="4"/>
      <rect x="700" y="536" width="60" height="8" rx="4"/>
    </g>

    <!-- street light pole (broken lamp, left) -->
    <g>
      <rect x="118" y="300" width="10" height="160" rx="5" fill="#8b8f94"/>
      <path d="M123 304 q0 -34 40 -34" stroke="#8b8f94" stroke-width="10" fill="none" stroke-linecap="round"/>
      <ellipse cx="168" cy="272" rx="18" ry="7" fill="#6f7378"/>
      <!-- glow -->
      <path d="M150 276 L186 276 L206 372 L130 372 Z" fill="url(#lampGlow)"/>
      <!-- broken/spark cue -->
      <path d="M162 262 l6 -10 M172 262 l-6 -10" stroke="#e4573d" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- pothole / water logging on the road -->
    <g>
      <ellipse cx="392" cy="516" rx="52" ry="18" fill="#b9b1a7"/>
      <ellipse cx="392" cy="514" rx="40" ry="12" fill="#8fa7b8" opacity="0.85"/>
      <ellipse cx="392" cy="512" rx="24" ry="6" fill="#c9dbe6" opacity="0.8"/>
    </g>

    <!-- CITIZEN on the left, photographing -->
    <g transform="translate(70,352)">
      <!-- shadow -->
      <ellipse cx="52" cy="196" rx="54" ry="12" fill="#000000" opacity="0.08"/>
      <!-- legs -->
      <rect x="34" y="140" width="19" height="56" rx="9" fill="#3f4b66"/>
      <rect x="56" y="140" width="19" height="56" rx="9" fill="#35405a"/>
      <!-- sari / body -->
      <path d="M24 66 q28 -18 56 0 l10 84 q-38 16 -76 0 Z" fill="#e4573d"/>
      <path d="M64 70 l14 82 q-10 5 -20 6 Z" fill="#c8462f"/>
      <!-- arm holding phone -->
      <path d="M74 84 q26 6 36 -12" stroke="#c68642" stroke-width="13" fill="none" stroke-linecap="round"/>
      <!-- phone -->
      <rect x="104" y="52" width="24" height="38" rx="6" fill="#1d1d1f"/>
      <rect x="108" y="58" width="16" height="24" rx="3" fill="#9ec1e0"/>
      <!-- head -->
      <circle cx="52" cy="44" r="26" fill="#c68642"/>
      <path d="M26 40 q6 -30 40 -26 q14 2 16 22 q-6 -12 -28 -10 q-20 2 -28 14 Z" fill="#241c17"/>
      <circle cx="64" cy="30" r="9" fill="#241c17"/>
      <!-- mobile signal cue -->
      <g stroke="#e4573d" stroke-width="3" fill="none" stroke-linecap="round">
        <path d="M132 44 q8 -8 16 0"/>
        <path d="M128 36 q12 -14 24 0"/>
      </g>
    </g>

    <!-- FLOATING MAP CARD (centre) -->
    <g transform="translate(300,74)">
      <rect x="0" y="0" width="214" height="150" rx="16" fill="#ffffff" stroke="#e6e3df"/>
      <rect x="0" y="0" width="214" height="34" rx="16" fill="#1d1d1f"/>
      <rect x="0" y="18" width="214" height="16" fill="#1d1d1f"/>
      <text x="14" y="23" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600"
            fill="#ffffff">Reports in this city</text>
      <!-- mini map streets -->
      <g stroke="#e6e3df" stroke-width="6" stroke-linecap="round">
        <path d="M16 66 H198"/>
        <path d="M16 110 H198"/>
        <path d="M58 48 V136"/>
        <path d="M120 48 V136"/>
        <path d="M172 48 V136"/>
      </g>
      <!-- pins -->
      <g>
        <path d="M52 54 a12 12 0 0 1 12 12 c0 8 -12 22 -12 22 s-12 -14 -12 -22 a12 12 0 0 1 12 -12 Z"
              fill="#e4573d"/>
        <circle cx="52" cy="66" r="4.5" fill="#ffffff"/>
        <path d="M116 92 a12 12 0 0 1 12 12 c0 8 -12 22 -12 22 s-12 -14 -12 -22 a12 12 0 0 1 12 -12 Z"
              fill="#e4573d"/>
        <circle cx="116" cy="104" r="4.5" fill="#ffffff"/>
        <path d="M168 54 a12 12 0 0 1 12 12 c0 8 -12 22 -12 22 s-12 -14 -12 -22 a12 12 0 0 1 12 -12 Z"
              fill="#2b6cb0"/>
        <circle cx="168" cy="66" r="4.5" fill="#ffffff"/>
      </g>
    </g>

    <!-- STUDENTS at a table (right) -->
    <g transform="translate(520,300)">
      <!-- table -->
      <rect x="0" y="128" width="272" height="16" rx="6" fill="#c99a6b"/>
      <rect x="14" y="144" width="12" height="52" rx="5" fill="#a97c4f"/>
      <rect x="246" y="144" width="12" height="52" rx="5" fill="#a97c4f"/>
      <ellipse cx="136" cy="204" rx="150" ry="14" fill="#000000" opacity="0.07"/>

      <!-- laptop -->
      <g transform="translate(150,74)">
        <rect x="0" y="0" width="66" height="44" rx="5" fill="#2f3440"/>
        <rect x="5" y="5" width="56" height="34" rx="3" fill="#9ec1e0"/>
        <rect x="-10" y="44" width="86" height="9" rx="4" fill="#c9cdd4"/>
        <!-- tiny chart on screen -->
        <g fill="#2b6cb0">
          <rect x="14" y="24" width="6" height="12" rx="2"/>
          <rect x="24" y="18" width="6" height="18" rx="2"/>
          <rect x="34" y="12" width="6" height="24" rx="2"/>
          <rect x="44" y="20" width="6" height="16" rx="2"/>
        </g>
      </g>

      <!-- prototype: solar street-light model on the table -->
      <g transform="translate(22,60)">
        <rect x="0" y="52" width="8" height="66" rx="4" fill="#8b8f94"/>
        <path d="M4 54 q0 -22 26 -22" stroke="#8b8f94" stroke-width="7" fill="none" stroke-linecap="round"/>
        <ellipse cx="34" cy="34" rx="14" ry="5" fill="#f0b429"/>
        <circle cx="34" cy="30" r="9" fill="#ffd36b" opacity="0.9"/>
        <rect x="-14" y="8" width="30" height="8" rx="4" fill="#2b6cb0" transform="rotate(-18 0 12)"/>
        <rect x="52" y="8" width="30" height="8" rx="4" fill="#2b6cb0" transform="rotate(18 66 12)"/>
      </g>

      <!-- student 1 -->
      <g transform="translate(72,52)">
        <ellipse cx="26" cy="80" rx="28" ry="8" fill="#000000" opacity="0.06"/>
        <path d="M4 44 q22 -14 44 0 l8 40 q-30 12 -60 0 Z" fill="#7fb069"/>
        <circle cx="26" cy="26" r="20" fill="#e0ac69"/>
        <path d="M6 22 q4 -22 34 -18 q12 2 12 16 q-6 -8 -22 -8 q-16 0 -24 10 Z" fill="#2b2119"/>
      </g>
      <!-- student 2 -->
      <g transform="translate(122,40)">
        <ellipse cx="26" cy="92" rx="28" ry="8" fill="#000000" opacity="0.06"/>
        <path d="M4 48 q22 -14 44 0 l8 46 q-30 12 -60 0 Z" fill="#2b6cb0"/>
        <circle cx="26" cy="28" r="20" fill="#8d5524"/>
        <path d="M4 24 q6 -22 36 -18 q12 2 12 16 q-8 -8 -24 -6 q-16 2 -24 8 Z" fill="#1a120b"/>
      </g>
      <!-- student 3 -->
      <g transform="translate(178,58)">
        <ellipse cx="24" cy="76" rx="26" ry="8" fill="#000000" opacity="0.06"/>
        <path d="M4 42 q20 -13 40 0 l8 38 q-28 12 -56 0 Z" fill="#f0b429"/>
        <circle cx="24" cy="24" r="19" fill="#f1c27d"/>
        <path d="M4 20 q4 -20 32 -16 q12 2 12 16 q-8 -8 -22 -6 q-14 0 -22 6 Z" fill="#3a2a1b"/>
      </g>
    </g>

    <!-- MENTOR with clipboard (centre-right, standing) -->
    <g transform="translate(430,236)">
      <ellipse cx="34" cy="212" rx="36" ry="10" fill="#000000" opacity="0.07"/>
      <rect x="18" y="152" width="16" height="60" rx="8" fill="#3f4b66"/>
      <rect x="36" y="152" width="16" height="60" rx="8" fill="#35405a"/>
      <path d="M6 62 q30 -18 58 0 l8 94 q-38 14 -74 0 Z" fill="#f7f6f4" stroke="#dcd7d1"/>
      <path d="M34 64 l6 92 q-14 5 -24 5 l-6 -92 Z" fill="#e4573d" opacity="0.9"/>
      <!-- clipboard -->
      <g transform="translate(62,66) rotate(8)">
        <rect x="0" y="0" width="46" height="60" rx="6" fill="#c99a6b"/>
        <rect x="4" y="6" width="38" height="48" rx="3" fill="#ffffff"/>
        <rect x="14" y="-6" width="18" height="10" rx="4" fill="#8b8f94"/>
        <g stroke="#c1c1c1" stroke-width="3" stroke-linecap="round">
          <path d="M11 20 h24"/><path d="M11 30 h24"/><path d="M11 40 h16"/>
        </g>
        <path d="M11 44 l4 5 9 -12" stroke="#1f7a4d" stroke-width="4" fill="none"
              stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <circle cx="34" cy="40" r="22" fill="#e0ac69"/>
      <path d="M12 34 q6 -24 40 -20 q12 2 12 18 q-8 -10 -24 -8 q-18 0 -28 10 Z" fill="#4a4a4a"/>
      <!-- glasses -->
      <g stroke="#1d1d1f" stroke-width="2.5" fill="none">
        <circle cx="27" cy="40" r="7"/><circle cx="45" cy="40" r="7"/><path d="M34 40 h4"/>
      </g>
    </g>

    <!-- floating tech cues -->
    <g opacity="0.9">
      <g transform="translate(232,150)">
        <rect x="0" y="0" width="86" height="30" rx="15" fill="#ffffff" stroke="#e6e3df"/>
        <circle cx="16" cy="15" r="7" fill="#e4573d"/>
        <text x="30" y="20" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600"
              fill="#3f3f3f">Report</text>
      </g>
      <g transform="translate(628,470)">
        <rect x="0" y="0" width="120" height="30" rx="15" fill="#ffffff" stroke="#e6e3df"/>
        <circle cx="16" cy="15" r="7" fill="#1f7a4d"/>
        <text x="30" y="20" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600"
              fill="#3f3f3f">Verified result</text>
      </g>
      <g transform="translate(30,470)">
        <rect x="0" y="0" width="104" height="30" rx="15" fill="#1d1d1f"/>
        <text x="16" y="20" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600"
              fill="#ffffff">Photo evidence</text>
      </g>
    </g>

    <!-- ground vignette -->
    <rect x="0" y="586" width="820" height="34" fill="#000000" opacity="0.04"/>
  </g>
</svg>

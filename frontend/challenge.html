<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Problem — SamadhanSetu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/design-system.css">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <link rel="stylesheet" href="/assets/css/dashboard.css">
  <link rel="stylesheet" href="/assets/css/responsive.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header"></header>
  <main id="main" class="container container--wide" style="padding-block:var(--space-7)">
    <div id="detail" aria-live="polite"></div>
  </main>
  <footer id="site-footer"></footer>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/app.js"></script>
  <script>
    (function () {
      "use strict";

      var id = parseInt(UI.param("id"), 10);
      var user = null;
      var challenge = null;
      var data = { screenings: [], reviews: [], clarifications: [], related: null,
                   solutions: null, corrections: [], attachments: [] };
      var REVIEWER = ["admin", "faculty", "university_admin", "university_faculty"];
      var OPEN = ["submitted", "needs_clarification", "pending_review"];
      var BLOCKED = ["excluded_government", "declined"];

      function isReviewer(u) { return !!u && REVIEWER.indexOf(u.role) !== -1; }

      function jsonList(text) {
        if (!text) return [];
        try {
          var v = JSON.parse(text);
          if (Array.isArray(v)) return v;
          if (typeof v === "string") return v.split(",").map(function (s) { return s.trim(); }).filter(Boolean);
          return [];
        } catch (e) {
          return String(text).split(",").map(function (s) { return s.trim(); }).filter(Boolean);
        }
      }

      function correctionsByField() {
        var map = {};
        data.corrections.forEach(function (c) { map[c.field] = c; });
        return map;
      }

      function disclosure(title, bodyHtml, open) {
        if (!bodyHtml) return "";
        return '<details class="disclosure"' + (open ? " open" : "") + '>' +
          "<summary>" + UI.esc(title) + "</summary>" +
          '<div class="disclosure__body stack">' + bodyHtml + "</div></details>";
      }

      function load() {
        var host = UI.qs("#detail");
        if (!id) { host.innerHTML = UI.errorState("No problem was specified."); return; }
        host.innerHTML = UI.loading("Loading problem…");

        API.get("/api/challenges/" + id).then(function (c) {
          challenge = c;
          var jobs = [
            API.get("/api/challenges/" + id + "/screenings").catch(function () { return []; }),
            API.get("/api/challenges/" + id + "/reviews").catch(function () { return []; }),
            API.get("/api/challenges/" + id + "/clarifications").catch(function () { return []; }),
            API.get("/api/challenges/" + id + "/related").catch(function () { return null; }),
            API.get("/api/challenges/" + id + "/corrections").catch(function () { return []; }),
            API.get("/api/challenges/" + id + "/attachments").catch(function () { return []; }),
          ];
          if (user) jobs.push(API.get("/api/challenges/" + id + "/solutions").catch(function () { return null; }));
          return Promise.all(jobs).then(function (res) {
            data.screenings = res[0] || [];
            data.reviews = res[1] || [];
            data.clarifications = res[2] || [];
            data.related = res[3];
            data.corrections = res[4] || [];
            data.attachments = res[5] || [];
            data.solutions = res[6] || null;
            render();
          });
        }).catch(function (err) {
          host.innerHTML = UI.emptyState("🔒", "Not available", err.message);
        });
      }

      // ---- journey ----------------------------------------------------------

      function journeySteps(c) {
        var reviewed = data.reviews.length > 0;
        var blocked = BLOCKED.indexOf(c.status) !== -1;
        var accepted = ["accepted", "in_project", "completed"].indexOf(c.status) !== -1;
        var hasProject = !!c.project;
        return [
          { label: "Reported by a citizen", state: "done",
            detail: UI.fmtDate(c.created_at) + (c.city ? " · " + c.city : "") },
          { label: "AI understood it", state: c.latest_screening ? "done" : "current",
            detail: c.latest_screening
              ? (c.latest_screening.source === "groq" ? "Groq-assisted" : "Rules-based (no AI key configured)")
              : "Not analysed yet" },
          { label: "Under review", state: blocked ? "blocked" : (reviewed ? "done" : "current"),
            detail: blocked
              ? "Recorded as " + UI.titleCase(c.status) + " — this cannot enter the student pipeline"
              : (reviewed ? "A reviewer recorded a decision" : "Awaiting a reviewer") },
          { label: "Accepted", state: accepted ? "done" : "pending",
            detail: accepted ? "A university has taken this on" : "Not yet accepted" },
          { label: "Project started", state: hasProject ? (c.status === "completed" ? "done" : "current") : "pending",
            detail: hasProject ? c.project.title : "No project yet" },
          { label: "Outcome documented", state: c.status === "completed" ? "done" : "pending",
            detail: c.status === "completed" ? "A verified impact report closes the loop" : "Not yet documented" },
        ];
      }

      // ---- summary ----------------------------------------------------------

      function correctedValue(field, original) {
        var map = correctionsByField();
        return map[field] ? map[field].corrected_value : original;
      }

      function insightBlock(field, label, original, options) {
        options = options || {};
        var map = correctionsByField();
        var correction = field ? map[field] : null;
        var value = correction ? correction.corrected_value : original;
        var note = options.note;
        if (correction) {
          note = "Corrected by " + (correction.corrected_by_name || "a user") + " on " +
            UI.fmtDate(correction.created_at) + ". " + (correction.note ? "Reason: " + correction.note : "") +
            " The original machine output is still stored: “" + (correction.original_value || "—") + "”";
        }
        return UI.insight(label, value || "—", {
          tone: options.tone, note: note, html: options.html,
        });
      }

      function statusChips(s) {
        var flags = "";
        flags += '<span class="badge ' + (s.government_dependency ? "badge--danger" : "badge--success") + '">' +
          (s.government_dependency ? "Flagged: needs government action"
                                   : "No government dependency detected") + "</span>";
        flags += '<span class="badge badge--neutral">Analysis: ' +
          (s.source === "groq" ? UI.esc(s.model || "Groq") : "local rules (no AI key)") + "</span>";
        flags += '<span class="badge badge--neutral">' +
          UI.esc(s.review_status === "corrected_by_human" ? "Corrected by a human"
            : s.review_status === "human_reviewed" ? "Reviewed by a human"
            : "AI complete — awaiting human review") + "</span>";
        return '<div class="chip-row">' + flags + "</div>";
      }

      // The default, problem-focused summary: one sentence + a short explanation,
      // who is affected and why it matters. Everything technical is disclosed below.
      function summaryPanel(c) {
        var s = c.latest_screening;
        if (!s) {
          return '<section class="panel card"><div class="panel__head">' +
            '<h2 class="panel__title">What this is about</h2>' +
            '<p class="panel__sub">No automated summary has been produced yet.</p></div>' +
            '<div class="panel__body"><p class="muted">The citizen\'s own words are below.</p></div></section>';
        }
        var html = "";
        html += '<div class="summary-hero"><p class="summary-hero__label">In one sentence</p>' +
          '<p class="summary-hero__text">' + UI.esc(s.one_sentence || s.problem_summary || "—") + "</p></div>";
        html += '<div class="insight-grid" style="margin-top:var(--space-5)">';
        html += insightBlock("simple_explanation", "What is happening",
          s.simple_explanation || s.problem_summary);
        html += insightBlock("who_is_affected", "Who is affected",
          s.who_is_affected || s.affected_users);
        html += insightBlock("why_it_matters", "Why it matters", s.why_it_matters);
        html += "</div>";
        html += '<div style="margin-top:var(--space-5)">' + statusChips(s) + "</div>";
        html += '<p class="muted" style="font-size:var(--fs-fine);margin-top:var(--space-3)">' +
          "This is an AI-assisted explanation, not a decision and not a verified probability. Only a " +
          "human reviewer decides what happens to this problem.</p>";
        return '<section class="panel card"><div class="panel__head">' +
          '<h2 class="panel__title">What this problem is about</h2>' +
          '<p class="panel__sub">An AI-assisted, plain-language summary. The citizen\'s original words are ' +
          "kept exactly as written.</p></div>" +
          '<div class="panel__body">' + html + "</div></section>";
      }

      function moreDetailsBody(c) {
        var s = c.latest_screening;
        if (!s) return "";
        var questions = jsonList(s.clarification_questions);
        var html = "";
        if (s.problem_summary) html += "<div><strong>Neutral summary</strong><p>" + UI.esc(s.problem_summary) + "</p></div>";
        if (s.technical_requirements) html += "<div><strong>Technical requirements</strong><p>" + UI.esc(s.technical_requirements) + "</p></div>";
        if (s.potential_solution) html += "<div><strong>A student team could try</strong><p>" + UI.esc(s.potential_solution) + "</p></div>";
        var skills = jsonList(s.suggested_skills);
        if (skills.length) html += "<div><strong>Skills this would need</strong><p>" + UI.esc(skills.join(", ")) + "</p></div>";
        if (s.explanation) html += "<div><strong>Reviewer-facing explanation</strong><p>" + UI.esc(s.explanation) + "</p></div>";
        if (questions.length) {
          html += "<div><strong>Suggested clarifying questions</strong><ul>" +
            questions.map(function (q) { return "<li>" + UI.esc(q) + "</li>"; }).join("") + "</ul></div>";
        }
        html += '<p class="muted" style="font-size:var(--fs-fine)">Analysed ' + UI.fmtDateTime(s.created_at) +
          (s.model ? " by " + UI.esc(s.model) : " by the local rules engine") + ".</p>";
        return html;
      }

      function causesBody(c) {
        var s = c.latest_screening;
        if (!s) return "";
        var causes = jsonList(s.possible_causes);
        if (!causes.length) return '<p class="muted">No specific cause was proposed.</p>';
        return "<ul>" + causes.map(function (x) { return "<li>" + UI.esc(x) + "</li>"; }).join("") + "</ul>" +
          '<p class="muted" style="font-size:var(--fs-fine)">Hypotheses to investigate, not established facts.</p>';
      }

      function impactBody(c) {
        var s = c.latest_screening;
        var html = "";
        if (c.impact_label) {
          html += "<div><strong>Stated by the citizen</strong><p>" + UI.esc(c.impact_label) + "</p></div>";
        }
        html += "<div><strong>Confidence in that figure</strong><p>" +
          UI.esc(c.impact_is_estimate
            ? "Citizen estimate — not verified by the platform"
            : "Citizen says it was measured — not independently verified") + "</p></div>";
        if (s && s.impact_summary) html += "<div><strong>AI interpretation</strong><p>" + UI.esc(s.impact_summary) + "</p></div>";
        if (!c.impact_label && (!s || !s.impact_summary)) {
          html += '<p class="muted">No impact figure was supplied. "I don\'t know" is a valid answer.</p>';
        }
        return html;
      }

      function factsBody(c) {
        var rows = [
          ["Who is affected (as reported)", c.affected_users],
          ["What happens today", c.current_situation],
          ["Desired outcome", c.desired_outcome],
          ["Constraints", c.constraints],
        ].filter(function (r) { return r[1]; });
        if (!rows.length) return "";
        return '<dl class="detail-list">' + rows.map(function (r) {
          return "<div><dt>" + UI.esc(r[0]) + "</dt><dd>" + UI.esc(r[1]) + "</dd></div>";
        }).join("") + "</dl>";
      }

      function originalWords(c) {
        return '<div class="prose">' + paragraphs(c.description) + "</div>" +
          '<p class="muted" style="font-size:var(--fs-fine)">Stored exactly as submitted. Nothing above ' +
          "replaces this text.</p>";
      }

      // ---- evidence, related, reviews, clarifications, corrections ----------

      function evidencePanel(c) {
        if (!data.attachments.length) return "";
        return '<section class="panel card"><div class="panel__head">' +
          '<h2 class="panel__title">Evidence photos</h2>' +
          '<p class="panel__sub">Private. Visible to the reporter, reviewers and the project team only.</p></div>' +
          '<div class="panel__body"><div class="evidence-strip">' +
          data.attachments.map(function (a) {
            return '<a href="' + UI.esc(a.url) + '" target="_blank" rel="noopener" title="' +
              UI.esc(a.original_name) + '"><img class="evidence-thumb" src="' + UI.esc(a.url) +
              '" alt="' + UI.esc("Photo evidence: " + a.original_name) + '" loading="lazy"></a>';
          }).join("") + "</div>" +
          '<p class="muted" style="font-size:var(--fs-fine);margin-top:var(--space-3)">Location and camera ' +
          "metadata was removed on upload. Files are served only to authorised viewers.</p></div></section>";
      }

      function relatedBody(rel) {
        if (!rel || !rel.related || !rel.related.length) return "";
        var items = rel.related.slice(0, 5).map(function (r) {
          return '<div class="dup-card' + (r.is_duplicate_candidate ? " dup-card--strong" : "") + '">' +
            '<div class="dup-card__head">' +
            '<a class="dup-card__title" href="/challenge.html?id=' + r.challenge_id + '">' + UI.esc(r.title) + "</a>" +
            (r.is_duplicate_candidate ? '<span class="dup-card__score">likely duplicate</span>' : "") + "</div>" +
            '<p class="muted" style="font-size:var(--fs-fine)">' + UI.esc(UI.domainLabel(r.category)) +
            (r.locality ? " · " + UI.esc(r.locality) : "") + " · " + UI.esc(UI.titleCase(r.status)) + "</p>" +
            '<p class="muted" style="font-size:var(--fs-fine)">' + (r.reasons || []).map(UI.esc).join(" · ") + "</p>" +
            "</div>";
        }).join("");
        return items + '<p class="muted" style="font-size:var(--fs-fine)">' + UI.esc(rel.note) + "</p>";
      }

      function reviewsBody() {
        if (!data.reviews.length) return '<p class="muted">No human decision has been recorded yet.</p>';
        return data.reviews.map(function (r) {
          return '<div class="detail-row"><div><strong>' + UI.esc(UI.titleCase(r.decision)) + "</strong>" +
            (r.overrides_ai ? ' <span class="badge badge--warning">Overrode the AI suggestion</span>' : "") +
            '<p class="muted" style="font-size:var(--fs-caption)">' + UI.esc(r.reason) + "</p>" +
            '<p class="muted" style="font-size:var(--fs-fine)">' + UI.esc(r.reviewer_name || "Reviewer") +
            " · " + UI.fmtDateTime(r.created_at) + "</p></div></div>";
        }).join("");
      }

      function correctionsBody(c) {
        var canCorrect = user && (isReviewer(user) || user.id === c.citizen_id);
        var list = data.corrections.length
          ? '<div class="stack">' + data.corrections.map(function (x) {
              return '<div class="detail-row"><div><strong>' + UI.esc(UI.titleCase(x.field)) + "</strong>" +
                '<p style="font-size:var(--fs-caption)">' + UI.esc(x.corrected_value) + "</p>" +
                '<p class="muted" style="font-size:var(--fs-fine)">' + UI.esc(x.corrected_by_name || "Someone") +
                " · " + UI.fmtDateTime(x.created_at) + (x.note ? " · " + UI.esc(x.note) : "") + "</p>" +
                '<p class="muted" style="font-size:var(--fs-fine)"><em>Original machine output kept: ' +
                UI.esc(x.original_value || "—") + "</em></p></div></div>";
            }).join("") + "</div>"
          : '<p class="muted" style="font-size:var(--fs-caption)">No corrections have been made.</p>';

        var form = canCorrect && c.latest_screening
          ? '<form id="correct-form" class="stack" style="margin-top:var(--space-4)">' +
            '<div class="field"><label class="field__label" for="corr-field">Which part needs correcting?</label>' +
            '<select class="select" id="corr-field">' +
            ["one_sentence:One sentence", "simple_explanation:Plain explanation",
             "who_is_affected:Who is affected", "why_it_matters:Why it matters",
             "impact_summary:Estimated impact", "possible_causes:Possible causes",
             "potential_solution:Possible solution", "skills_required:Skills needed"]
              .map(function (pair) {
                var bits = pair.split(":");
                return '<option value="' + bits[0] + '">' + UI.esc(bits[1]) + "</option>";
              }).join("") +
            "</select></div>" +
            '<div class="field"><label class="field__label" for="corr-value">The correct text</label>' +
            '<textarea class="input" id="corr-value" rows="3" required></textarea></div>' +
            '<div class="field"><label class="field__label" for="corr-note">Why? ' +
            '<span class="muted">(optional)</span></label>' +
            '<input class="input" id="corr-note" maxlength="1000"></div>' +
            '<button class="btn btn--secondary" type="submit">Save correction</button>' +
            '<p class="muted" style="font-size:var(--fs-fine)">The original analysis is kept. Both versions ' +
            "stay visible above and in the audit trail.</p></form>"
          : (user ? '<p class="muted" style="font-size:var(--fs-fine)">Only the citizen who reported it or ' +
              "a reviewer can correct the summary.</p>" : "");

        return list + form;
      }

      function clarificationsBody(c, isOwner, reviewer) {
        var list = data.clarifications.length
          ? data.clarifications.map(function (q) {
              return '<div class="detail-row"><div>' +
                "<p><strong>Q:</strong> " + UI.esc(q.question) + "</p>" +
                '<p class="muted" style="font-size:var(--fs-fine)">' +
                UI.esc(q.asked_by_name || "Reviewer") + " · " + UI.fmtDate(q.created_at) + "</p>" +
                (q.answer
                  ? "<p><strong>A:</strong> " + UI.esc(q.answer) + '</p><p class="muted" style="font-size:var(--fs-fine)">' +
                    UI.esc(q.answered_by_name || "Citizen") + " · " + UI.fmtDate(q.answered_at) + "</p>"
                  : (isOwner
                    ? '<form class="answer-form" data-cid="' + q.id + '" style="margin-top:var(--space-3)">' +
                      '<div class="field"><label class="field__label" for="a-' + q.id + '">Your answer</label>' +
                      '<textarea class="input" id="a-' + q.id + '" rows="2" required></textarea></div>' +
                      '<button class="btn btn--primary btn--sm" type="submit">Send answer</button></form>'
                    : '<span class="badge badge--warning">Awaiting the citizen\'s answer</span>')) +
                "</div></div>";
            }).join("")
          : '<p class="muted">No clarification requests.</p>';

        var ask = reviewer
          ? '<form id="ask-form" style="margin-top:var(--space-4)">' +
            '<div class="field"><label class="field__label" for="ask-q">Ask the citizen a question</label>' +
            '<textarea class="input" id="ask-q" rows="2" required minlength="5" ' +
            'placeholder="What detail do you need?"></textarea></div>' +
            '<button class="btn btn--secondary btn--sm" type="submit">Send question</button></form>'
          : "";

        return list + ask;
      }

      function solutionsBody(res) {
        if (!res) return "";
        var matches = res.matches || [];
        var header = '<p class="muted" style="font-size:var(--fs-fine)">Searched ' +
          UI.esc((res.sources_searched || []).join(", ")) + " · analysed by " + UI.esc(res.analysed_by) + "</p>";
        if (!matches.length) {
          return header + '<p class="muted">No similar prior work was found in the internal repository.</p>' +
            notes(res);
        }
        var body = matches.map(function (m) {
          var rec = m.recommendation === "reuse" ? "badge--success"
            : (m.recommendation === "adapt" ? "badge--warning" : "badge--neutral");
          return '<div class="detail-row"><div><div class="chip-row">' +
            '<span class="badge ' + rec + '">' + UI.esc(UI.titleCase(m.recommendation)) + "</span>" +
            UI.demoTag(m.is_demo) +
            '<span class="badge badge--neutral">' + Math.round(m.similarity * 100) + "% text similarity</span>" +
            "</div>" +
            '<p style="margin-top:var(--space-3)"><strong>' + UI.esc(m.title) + "</strong></p>" +
            '<p style="font-size:var(--fs-caption)"><em>' + UI.esc(m.relevance_explanation) + "</em></p>" +
            '<p class="muted" style="font-size:var(--fs-fine)">Source: ' +
            UI.esc(m.source_label || "internal repository") + "</p>" +
            '<details class="disclosure" style="margin-top:var(--space-2)"><summary>More about this match' +
            "</summary><div class=\"disclosure__body stack\">" +
            "<p>" + UI.esc(String(m.description).slice(0, 600)) + "</p>" +
            '<p class="muted" style="font-size:var(--fs-fine)">Tech: ' + UI.esc(m.technologies || "—") +
            " · Licence: " + UI.esc(m.license_info || "not recorded") +
            " · Limitations: " + UI.esc(m.limitations || "—") + "</p>" +
            (m.source_url ? '<a class="btn btn--ghost btn--sm" href="' + UI.esc(m.source_url) +
              '" target="_blank" rel="noopener">Open source (' + UI.esc(m.source_label || "link") + ")</a>" : "") +
            "</div></details>" +
            "</div></div>";
        }).join("");
        return header +
          '<p class="muted" style="font-size:var(--fs-fine)"><strong>Similarity is a search signal, not ' +
          "proof.</strong> A mentor must verify suitability, licensing and safety before anything is reused." +
          "</p>" + body + notes(res);
      }

      function notes(res) {
        if (!res || !res.limitations || !res.limitations.length) return "";
        return '<p class="muted" style="font-size:var(--fs-fine)">' + res.limitations.map(UI.esc).join(" ") + "</p>";
      }

      function projectBody(c) {
        var p = c.project;
        if (!p) return "";
        return '<div class="detail-row"><div><strong>' + UI.esc(p.title) + "</strong>" +
          '<p class="muted" style="font-size:var(--fs-caption)">' + UI.esc(p.problem_statement || "") + "</p>" +
          '<p class="muted" style="font-size:var(--fs-fine)">' +
          (p.mentor_name ? "Mentor: " + UI.esc(p.mentor_name) + " · " : "") +
          (p.university_name ? UI.esc(p.university_name) + " · " : "") +
          UI.esc(UI.titleCase(p.status)) + "</p>" +
          '<a class="btn btn--secondary btn--sm" href="/project.html?id=' + p.id +
          '" style="margin-top:var(--space-2)">Open the project workspace</a></div></div>';
      }

      // ---- actions ----------------------------------------------------------

      function nextAction(c, isOwner, reviewer) {
        if (c.project) {
          return { text: "This problem has a student project underway.", href: "/project.html?id=" + c.project.id,
                   label: "Open the project" };
        }
        if (reviewer && OPEN.indexOf(c.status) !== -1) {
          return { text: "This problem is waiting for a human review decision.", anchor: "review-form",
                   label: "Review this problem" };
        }
        if (reviewer && c.status === "approved") {
          return { text: "Approved for student innovation. An authorised coordinator can scope a project.",
                   label: "Scope a student project", scope: true };
        }
        if (isOwner && c.status === "needs_clarification") {
          return { text: "A reviewer has asked you a question below.", anchor: "ask-answer",
                   label: "Answer the question" };
        }
        if (BLOCKED.indexOf(c.status) !== -1) {
          return { text: "This problem was recorded as " + UI.titleCase(c.status) +
                   " and cannot enter the student pipeline." };
        }
        if (OPEN.indexOf(c.status) !== -1) {
          return { text: "Awaiting a reviewer's decision. You will be notified when it changes." };
        }
        return { text: "No action is needed from you right now." };
      }

      function actionsPanel(c, isOwner, reviewer) {
        var actions = [];
        if (reviewer && OPEN.indexOf(c.status) !== -1) {
          actions.push(
            '<form id="review-form" class="stack">' +
            '<div class="field"><label class="field__label" for="rv-decision">Decision</label>' +
            '<select class="select" id="rv-decision">' +
            '<option value="approved">Approve for student innovation</option>' +
            '<option value="needs_clarification">Needs clarification</option>' +
            '<option value="excluded_government">Exclude — government-dependent</option>' +
            '<option value="declined">Decline — not suitable</option>' +
            "</select></div>" +
            '<div class="field"><label class="field__label" for="rv-reason">Reason (required, min 10 ' +
            'characters)</label><textarea class="input" id="rv-reason" rows="3" required minlength="10">' +
            "</textarea><span class=\"field__hint\">Stored permanently in the audit trail.</span></div>" +
            '<button class="btn btn--primary" type="submit">Record decision</button></form>');
        }
        if (reviewer && c.status === "approved") {
          actions.push('<button class="btn btn--secondary btn--block" id="accept-btn">University accepts ' +
            "this problem</button>");
        }
        if (isOwner || reviewer) {
          actions.push('<button class="btn btn--ghost btn--block" id="rescreen-btn">Re-run the automated ' +
            "summary</button>");
        }
        if (!actions.length) {
          actions.push('<p class="muted" style="font-size:var(--fs-caption)">No actions are available for ' +
            "your role on this problem.</p>");
        }
        return '<section class="panel card"><div class="panel__head"><h2 class="panel__title">Actions</h2>' +
          '<p class="panel__sub">Your role: ' +
          UI.esc(App.roleLabel(user ? user.role : "visitor")) + "</p></div>" +
          '<div class="panel__body stack">' + actions.join("") + "</div></section>";
      }

      // ---- render -----------------------------------------------------------

      function render() {
        var c = challenge;
        var isOwner = user && user.id === c.citizen_id;
        var reviewer = isReviewer(user);

        var relatedCount = (data.related && data.related.related && data.related.related.length) || 1;
        var next = nextAction(c, isOwner, reviewer);

        var html = "";
        html += '<div class="page-head">' +
          '<div class="chip-row" style="margin-bottom:var(--space-3)">' + UI.badge(c.status) +
          '<span class="chip" style="pointer-events:none">' + UI.esc(UI.domainLabel(c.category)) + "</span>" +
          (c.difficulty ? '<span class="chip" style="pointer-events:none">' +
            UI.esc(UI.titleCase(c.difficulty)) + "</span>" : "") +
          (c.group_key ? '<span class="chip" style="pointer-events:none">🔗 ' + relatedCount +
            " related report" + (relatedCount === 1 ? "" : "s") + "</span>" : "") +
          "</div>" +
          "<h1>" + UI.esc(c.title) + "</h1>" +
          '<p class="lead">' +
          ([c.locality, c.city].filter(Boolean).length
            ? "📍 " + UI.esc([c.locality, c.city].filter(Boolean).join(", ")) + " · "
            : (c.location ? "📍 " + UI.esc(c.location) + " · " : "")) +
          "Reported " + UI.fmtDate(c.created_at) + "</p>" +
          "</div>";

        // Next-step callout — the one thing to do here.
        html += '<div class="insight insight--info" style="margin-bottom:var(--space-6)">' +
          '<p class="insight__label">Next step</p><div class="insight__value">' + UI.esc(next.text) +
          (next.label
            ? ' <button class="btn btn--primary btn--sm" data-next="' +
              UI.esc(next.anchor || "") + '" style="margin-left:var(--space-3)">' + UI.esc(next.label) + "</button>"
            : "") +
          "</div></div>";

        html += '<div class="split">';

        // left column
        html += '<div class="stack">';
        html += summaryPanel(c);
        html += evidencePanel(c);

        // Everything secondary is collapsed.
        var detailsBody = "";
        detailsBody += disclosure("View the original description", originalWords(c), true);
        detailsBody += disclosure("More AI details", moreDetailsBody(c));
        detailsBody += disclosure("Possible causes", causesBody(c));
        detailsBody += disclosure("Estimated impact", impactBody(c));
        detailsBody += disclosure("More about what the citizen reported", factsBody(c));
        detailsBody += disclosure("Related reports", relatedBody(data.related));
        detailsBody += disclosure("Existing solution recommendations", solutionsBody(data.solutions));
        detailsBody += disclosure("Human review history", reviewsBody());
        detailsBody += disclosure("Corrections and clarifications",
          correctionsBody(c) + clarificationsBody(c, isOwner, reviewer));
        if (c.project) detailsBody += disclosure("Project history and outcome evidence", projectBody(c));

        html += '<section class="panel card"><div class="panel__head">' +
          '<h2 class="panel__title">Details</h2>' +
          '<p class="panel__sub">Open only what you need — the essentials are above.</p></div>' +
          '<div class="panel__body">' + detailsBody + "</div></section>";
        html += "</div>";

        // right column
        html += '<div class="stack">';
        html += '<section class="panel card"><div class="panel__head">' +
          '<h2 class="panel__title">The journey</h2>' +
          '<p class="panel__sub">Only stages that have actually been reached are marked.</p></div>' +
          '<div class="panel__body">' + UI.journey(journeySteps(c)) + "</div></section>";
        html += actionsPanel(c, isOwner, reviewer);
        html += "</div>";

        html += "</div>";

        UI.qs("#detail").innerHTML = html;
        wire(c, isOwner, reviewer);
      }

      function paragraphs(text) {
        return String(text || "").split(/\n+/).filter(Boolean).map(function (p) {
          return "<p>" + UI.esc(p) + "</p>";
        }).join("");
      }

      function wire(c, isOwner, reviewer) {
        UI.qsa("[data-next]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var target = btn.getAttribute("data-next");
            if (target) {
              var el = UI.qs("#" + target);
              if (el) { el.scrollIntoView({ behavior: "smooth", block: "center" }); return; }
            }
            // Open the review disclosure and focus the decision form.
            UI.qsa("details.disclosure").forEach(function (d) { d.open = true; });
            var rf = UI.qs("#review-form");
            if (rf) { rf.scrollIntoView({ behavior: "smooth", block: "center" }); }
          });
        });

        var rf = UI.qs("#review-form");
        if (rf) rf.addEventListener("submit", function (e) {
          e.preventDefault();
          UI.clearFieldErrors(rf);
          var payload = { decision: UI.qs("#rv-decision").value, reason: UI.qs("#rv-reason").value.trim() };
          if (payload.reason.length < 10) {
            UI.showFieldError(rf, "reason", "Please write at least 10 characters explaining the decision.");
            return;
          }
          var btn = rf.querySelector("button");
          UI.setBusy(btn, true, "Recording…");
          API.post("/api/challenges/" + id + "/review", payload).then(function () {
            UI.toast("Decision recorded.", "success");
            load();
          }).catch(function (err) {
            UI.setBusy(btn, false);
            UI.toast(err.message, "error");
          });
        });

        var af = UI.qs("#ask-form");
        if (af) af.addEventListener("submit", function (e) {
          e.preventDefault();
          var q = UI.qs("#ask-q").value.trim();
          if (q.length < 5) { UI.toast("Please write a longer question.", "error"); return; }
          API.post("/api/challenges/" + id + "/clarifications", { question: q }).then(function () {
            UI.toast("Question sent to the citizen.", "success");
            load();
          }).catch(function (err) { UI.toast(err.message, "error"); });
        });

        UI.qsa(".answer-form").forEach(function (f) {
          f.addEventListener("submit", function (e) {
            e.preventDefault();
            var answer = f.querySelector("textarea").value.trim();
            if (answer.length < 2) { UI.toast("Please write your answer.", "error"); return; }
            API.post("/api/challenges/" + id + "/clarifications/" + f.dataset.cid + "/answer",
              { answer: answer }).then(function () {
                UI.toast("Answer sent.", "success");
                load();
              }).catch(function (err) { UI.toast(err.message, "error"); });
          });
        });

        var cf = UI.qs("#correct-form");
        if (cf) cf.addEventListener("submit", function (e) {
          e.preventDefault();
          var value = UI.qs("#corr-value").value.trim();
          if (value.length < 1) { UI.toast("Please write the corrected text.", "error"); return; }
          var btn = cf.querySelector("button");
          UI.setBusy(btn, true, "Saving…");
          API.correctSummary(id, {
            field: UI.qs("#corr-field").value,
            corrected_value: value,
            note: UI.qs("#corr-note").value.trim() || null,
          }).then(function () {
            UI.toast("Correction saved. The original analysis is still stored.", "success");
            load();
          }).catch(function (err) {
            UI.setBusy(btn, false);
            UI.toast(err.message, "error");
          });
        });

        var accept = UI.qs("#accept-btn");
        if (accept) accept.addEventListener("click", function () {
          UI.setBusy(accept, true, "Accepting…");
          API.post("/api/challenges/" + id + "/accept", {}).then(function () {
            UI.toast("This problem is now accepted by a university.", "success");
            load();
          }).catch(function (e2) { UI.setBusy(accept, false); UI.toast(e2.message, "error"); });
        });

        var rescreen = UI.qs("#rescreen-btn");
        if (rescreen) rescreen.addEventListener("click", function () {
          UI.setBusy(rescreen, true, "Analysing…");
          API.post("/api/challenges/" + id + "/screen", {}).then(function () {
            UI.toast("Summary re-run. A reviewer still decides.", "success");
            load();
          }).catch(function (e2) { UI.setBusy(rescreen, false); UI.toast(e2.message, "error"); });
        });
      }

      App.ready.then(function (u) {
        user = u;
        load();
      });
    })();
  </script>
</body>
</html>
